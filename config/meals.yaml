# 주간 식단·구매 목록·레서피 설정(가족용 기본 틀).
# 가족 구성·알레르기·요리 시간·예산·장보는 곳은 첫 인터뷰의 가족 프로필에서 읽는다(이 파일에는 적지 않는다).
schedule:
  plan: {day: thu, time: "09:30"}              # 식단 생성 + 알림
  cart_login: {day: thu, time: "10:00"}        # 식단 알림 뒤: 쿠팡 로그인 요청(장바구니 담기는 승인 후 실행)
  grocery_reminder: {day: fri, time: "09:30"}
  delivery_reminder: {day: sat, time: "09:00"}
prefs:
  cuisine_base: 가정식 한식                       # 기본 요리 종류
  cuisine_variety: []                            # 변화 주에 돌려 쓸 요리 종류(인터뷰에서 채움)
  variety_weeks_of_month: []                     # 변화 주로 할 주차(예: [2, 4])
  style: 채소가 충분하고 가격 효율이 좋은 가정식
  tools: 일반 가정용 조리도구
pantry: []                                       # 집에 있는 재료: 구매 목록에서 뺀다

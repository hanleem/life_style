# AI(Codex)를 쓸 수 없을 때(한도 초과·오류·로그아웃) 쓰는 기본 가정식 4주분 저녁 메뉴.
# 4인 가족(어른 2 + 초등 아이 2) 기준 분량, 아이용 맵기 0~1단계. 한 주에 7끼, 주마다 돌려 쓴다.
# 재료: n=이름, q=분량, c=장보기 분류. 집에 항상 있는 기본 양념(소금·간장·설탕·참기름·후추·마늘)은 적지 않는다.
weeks:
  - dinners:
      - title: 된장찌개와 계란말이
        time_min: 30
        ingredients: [{n: 두부, q: 1모, c: 단백질}, {n: 애호박, q: 1개, c: 채소}, {n: 양파, q: 1개, c: 채소}, {n: 달걀, q: 5개, c: 단백질}, {n: 대파, q: 1대, c: 채소}]
        steps: ["멸치 육수에 된장을 풀고 애호박·양파·두부를 넣어 끓인다", "달걀에 다진 파를 섞어 얇게 부쳐 돌돌 만다", "밥, 김치와 함께 낸다(아이는 김치 대신 김)"]
      - title: 소불고기와 시금치나물
        time_min: 35
        ingredients: [{n: 불고기용 소고기, q: 600g, c: 정육}, {n: 양파, q: 1개, c: 채소}, {n: 당근, q: 1/2개, c: 채소}, {n: 시금치, q: 1단, c: 채소}]
        steps: ["소고기를 간장·설탕·배즙·다진 마늘에 재운다", "시금치는 데쳐 참기름과 소금으로 무친다", "양파·당근과 함께 볶아 낸다"]
      - title: 고등어구이와 미역국
        time_min: 30
        ingredients: [{n: 고등어, q: 2손, c: 생선}, {n: 마른 미역, q: 20g, c: 건어물}, {n: 소고기 국거리, q: 150g, c: 정육}, {n: 무, q: 1/4개, c: 채소}, {n: 콩나물, q: 1봉, c: 채소}]
        steps: ["미역을 불려 소고기와 참기름에 볶다가 물을 붓고 끓인다", "고등어는 소금을 살짝 뿌려 팬에 굽는다", "콩나물은 삶아 무쳐 반찬으로 낸다"]
      - title: 순한 닭볶음탕
        time_min: 40
        ingredients: [{n: 닭볶음탕용 닭, q: 1마리, c: 정육}, {n: 감자, q: 3개, c: 채소}, {n: 당근, q: 1개, c: 채소}, {n: 양파, q: 1개, c: 채소}, {n: 브로콜리, q: 1송이, c: 채소}]
        steps: ["닭은 끓는 물에 데쳐 씻는다", "간장·설탕·다진 마늘 양념과 물을 붓고 감자·당근을 넣어 끓인다", "브로콜리는 데쳐 곁들인다(어른은 고춧가루를 따로 얹는다)"]
      - title: 두부조림과 멸치볶음
        time_min: 25
        ingredients: [{n: 두부, q: 2모, c: 단백질}, {n: 잔멸치, q: 80g, c: 건어물}, {n: 대파, q: 1대, c: 채소}, {n: 깻잎, q: 1묶음, c: 채소}]
        steps: ["두부를 도톰하게 썰어 노릇하게 부친다", "간장 양념에 파를 넣고 두부를 조린다", "멸치는 마른 팬에 볶다가 간장·올리고당으로 버무린다"]
      - title: 카레라이스와 오이무침
        time_min: 35
        ingredients: [{n: 순한맛 카레, q: 1팩, c: 가공식품}, {n: 돼지고기 앞다리, q: 300g, c: 정육}, {n: 감자, q: 2개, c: 채소}, {n: 당근, q: 1개, c: 채소}, {n: 양파, q: 2개, c: 채소}, {n: 오이, q: 2개, c: 채소}]
        steps: ["고기와 양파를 볶고 감자·당근을 넣어 물과 함께 끓인다", "불을 끄고 카레를 풀어 한소끔 더 끓인다", "오이는 식초·설탕·소금으로 가볍게 무친다"]
      - title: 소고기 야채죽과 계란찜
        time_min: 40
        ingredients: [{n: 소고기 다짐육, q: 200g, c: 정육}, {n: 쌀, q: 2컵, c: 곡류}, {n: 당근, q: 1/2개, c: 채소}, {n: 애호박, q: 1/2개, c: 채소}, {n: 달걀, q: 4개, c: 단백질}]
        steps: ["불린 쌀과 다진 소고기를 참기름에 볶는다", "물을 붓고 잘게 다진 채소를 넣어 푹 끓인다", "달걀을 풀어 물과 섞어 중탕으로 찐다"]
  - dinners:
      - title: 순두부찌개(순한맛)와 달걀프라이
        time_min: 25
        ingredients: [{n: 순두부, q: 2봉, c: 단백질}, {n: 돼지고기 다짐육, q: 150g, c: 정육}, {n: 달걀, q: 4개, c: 단백질}, {n: 대파, q: 1대, c: 채소}, {n: 애호박, q: 1/2개, c: 채소}]
        steps: ["파·다진 고기를 기름에 볶고 물을 붓는다", "순두부와 애호박을 넣어 끓이고 간을 한다", "달걀을 풀어 넣는다(어른은 고추기름을 따로)"]
      - title: 제육볶음(순한맛)과 상추쌈
        time_min: 30
        ingredients: [{n: 돼지고기 앞다리, q: 600g, c: 정육}, {n: 양파, q: 2개, c: 채소}, {n: 상추, q: 2봉, c: 채소}, {n: 대파, q: 1대, c: 채소}]
        steps: ["고기를 간장·설탕·다진 마늘·케첩 약간에 재운다", "센 불에 양파·파와 볶는다", "상추에 싸서 먹는다"]
      - title: 연어구이와 시금치 된장국
        time_min: 30
        ingredients: [{n: 연어, q: 600g, c: 생선}, {n: 시금치, q: 1단, c: 채소}, {n: 두부, q: 1모, c: 단백질}, {n: 레몬, q: 1개, c: 과일}]
        steps: ["연어에 소금·후추를 하고 팬에 앞뒤로 굽는다", "된장국에 시금치와 두부를 넣어 끓인다", "연어에 레몬즙을 뿌린다"]
      - title: 닭가슴살 채소 볶음밥과 달걀국
        time_min: 25
        ingredients: [{n: 닭가슴살, q: 400g, c: 정육}, {n: 밥, q: 5공기, c: 곡류}, {n: 당근, q: 1개, c: 채소}, {n: 애호박, q: 1개, c: 채소}, {n: 양파, q: 1개, c: 채소}, {n: 달걀, q: 4개, c: 단백질}]
        steps: ["닭가슴살과 채소를 잘게 썬다", "기름에 닭고기와 채소를 볶다가 밥과 간장을 넣고 볶는다", "멸치 육수에 달걀을 풀어 국을 끓인다"]
      - title: 소고기 무국과 감자채볶음
        time_min: 40
        ingredients: [{n: 소고기 국거리, q: 300g, c: 정육}, {n: 무, q: 1/2개, c: 채소}, {n: 감자, q: 3개, c: 채소}, {n: 대파, q: 1대, c: 채소}]
        steps: ["소고기와 무를 참기름에 볶고 물을 부어 푹 끓인다", "감자는 채 썰어 물에 헹궈 기름에 볶는다", "국은 간장·소금으로 간한다"]
      - title: 잔치국수와 애호박전
        time_min: 35
        ingredients: [{n: 소면, q: 400g, c: 곡류}, {n: 애호박, q: 2개, c: 채소}, {n: 달걀, q: 4개, c: 단백질}, {n: 당근, q: 1개, c: 채소}, {n: 김가루, q: 1봉, c: 건어물}]
        steps: ["멸치 육수를 우려 간한다", "소면을 삶아 찬물에 헹구고 육수를 붓는다", "채 썬 채소와 지단, 김가루를 올리고 애호박전을 곁들인다"]
      - title: 떡갈비와 콩나물국
        time_min: 40
        ingredients: [{n: 소고기 다짐육, q: 300g, c: 정육}, {n: 돼지고기 다짐육, q: 300g, c: 정육}, {n: 콩나물, q: 1봉, c: 채소}, {n: 대파, q: 1대, c: 채소}]
        steps: ["두 가지 고기에 간장·설탕·다진 마늘·다진 양파를 섞어 치댄다", "납작하게 빚어 팬에 노릇하게 굽는다", "콩나물국은 멸치 육수에 콩나물과 파를 넣어 끓인다"]
  - dinners:
      - title: 삼치구이와 두부 김치볶음(순한맛)
        time_min: 30
        ingredients: [{n: 삼치, q: 2토막, c: 생선}, {n: 두부, q: 2모, c: 단백질}, {n: 백김치, q: 1/4포기, c: 채소}, {n: 돼지고기 앞다리, q: 200g, c: 정육}]
        steps: ["삼치는 소금을 뿌려 구워 낸다", "두부를 데쳐 썬다", "고기와 백김치를 볶아 두부와 함께 낸다"]
      - title: 소고기 미역국과 잡채
        time_min: 45
        ingredients: [{n: 소고기 국거리, q: 200g, c: 정육}, {n: 마른 미역, q: 20g, c: 건어물}, {n: 당면, q: 200g, c: 곡류}, {n: 시금치, q: 1/2단, c: 채소}, {n: 당근, q: 1개, c: 채소}, {n: 양파, q: 1개, c: 채소}]
        steps: ["미역국을 끓인다", "당면을 삶고 채소를 각각 볶는다", "간장·설탕·참기름으로 모두 버무린다"]
      - title: 돈가스와 양배추샐러드
        time_min: 40
        ingredients: [{n: 돼지고기 등심, q: 4장, c: 정육}, {n: 빵가루, q: 1봉, c: 가공식품}, {n: 달걀, q: 2개, c: 단백질}, {n: 양배추, q: 1/4통, c: 채소}, {n: 방울토마토, q: 1팩, c: 채소}]
        steps: ["고기를 두드려 소금·후추를 하고 밀가루·달걀·빵가루 순으로 입힌다", "170도 기름에 앞뒤로 튀기듯 굽는다(기름 적게, 에어프라이어도 가능)", "채 썬 양배추와 토마토를 곁들인다"]
      - title: 대구지리와 두부부침
        time_min: 35
        ingredients: [{n: 대구, q: 1마리, c: 생선}, {n: 무, q: 1/3개, c: 채소}, {n: 두부, q: 1모, c: 단백질}, {n: 미나리, q: 1줌, c: 채소}, {n: 대파, q: 1대, c: 채소}]
        steps: ["무를 넣어 육수를 끓인다", "대구와 두부를 넣고 맑게 끓인다", "미나리와 파를 넣고 소금으로 간한다"]
      - title: 닭고기 야채 덮밥
        time_min: 30
        ingredients: [{n: 닭다리살, q: 500g, c: 정육}, {n: 양파, q: 2개, c: 채소}, {n: 대파, q: 1대, c: 채소}, {n: 달걀, q: 4개, c: 단백질}, {n: 브로콜리, q: 1송이, c: 채소}]
        steps: ["닭고기와 양파를 간장·설탕·물에 조린다", "달걀을 풀어 둘러 반숙으로 익힌다", "밥 위에 올리고 데친 브로콜리를 곁들인다"]
      - title: 소고기 버섯전골
        time_min: 35
        ingredients: [{n: 전골용 소고기, q: 400g, c: 정육}, {n: 모둠 버섯, q: 2팩, c: 채소}, {n: 배추, q: 1/4통, c: 채소}, {n: 당면, q: 100g, c: 곡류}, {n: 두부, q: 1모, c: 단백질}]
        steps: ["냄비에 재료를 둘러 담고 멸치 육수와 간장으로 간한다", "끓으면 고기가 익을 때까지 더 끓인다", "당면을 넣고 마무리한다"]
      - title: 참치 야채전과 어묵국
        time_min: 30
        ingredients: [{n: 참치캔, q: 2개, c: 가공식품}, {n: 달걀, q: 4개, c: 단백질}, {n: 당근, q: 1개, c: 채소}, {n: 부추, q: 1줌, c: 채소}, {n: 어묵, q: 4장, c: 가공식품}, {n: 무, q: 1/4개, c: 채소}]
        steps: ["기름 뺀 참치에 달걀·다진 채소를 섞어 부친다", "무와 멸치 육수에 어묵을 넣고 끓인다", "간장을 곁들여 낸다"]
  - dinners:
      - title: 소고기 뭇국과 계란 장조림
        time_min: 45
        ingredients: [{n: 소고기 홍두깨, q: 400g, c: 정육}, {n: 달걀, q: 8개, c: 단백질}, {n: 무, q: 1/2개, c: 채소}, {n: 꽈리고추, q: 1줌, c: 채소}]
        steps: ["고기를 삶아 건지고 육수를 둔다", "육수에 간장·설탕을 넣고 고기와 삶은 달걀을 조린다", "무를 넣어 맑은 국을 끓인다"]
      - title: 고등어 무조림(순한맛)
        time_min: 40
        ingredients: [{n: 고등어, q: 2마리, c: 생선}, {n: 무, q: 1/2개, c: 채소}, {n: 양파, q: 1개, c: 채소}, {n: 대파, q: 1대, c: 채소}, {n: 시금치, q: 1단, c: 채소}]
        steps: ["무를 깔고 물, 간장, 설탕, 다진 마늘 양념을 붓고 끓인다", "고등어와 양파를 올려 졸인다", "시금치나물을 곁들인다"]
      - title: 치킨 데리야끼와 감자수프
        time_min: 40
        ingredients: [{n: 닭다리살, q: 600g, c: 정육}, {n: 감자, q: 3개, c: 채소}, {n: 우유, q: 500ml, c: 유제품}, {n: 양파, q: 1개, c: 채소}, {n: 브로콜리, q: 1송이, c: 채소}]
        steps: ["닭고기를 구운 뒤 간장·설탕·맛술 소스를 졸인다", "감자와 양파를 볶아 삶은 뒤 우유를 넣어 갈아 끓인다", "브로콜리를 곁들인다"]
      - title: 비빔밥과 두부 달걀국
        time_min: 40
        ingredients: [{n: 소고기 다짐육, q: 250g, c: 정육}, {n: 시금치, q: 1/2단, c: 채소}, {n: 콩나물, q: 1봉, c: 채소}, {n: 당근, q: 1개, c: 채소}, {n: 애호박, q: 1개, c: 채소}, {n: 달걀, q: 5개, c: 단백질}, {n: 두부, q: 1모, c: 단백질}]
        steps: ["나물을 각각 데치거나 볶아 간한다", "소고기를 볶고 달걀프라이를 한다", "밥에 올려 비비고(어른은 고추장), 달걀 두부국을 곁들인다"]
      - title: 새우 볶음밥과 브로콜리 수프
        time_min: 30
        ingredients: [{n: 칵테일 새우, q: 300g, c: 생선}, {n: 밥, q: 5공기, c: 곡류}, {n: 달걀, q: 3개, c: 단백질}, {n: 당근, q: 1개, c: 채소}, {n: 브로콜리, q: 2송이, c: 채소}, {n: 우유, q: 300ml, c: 유제품}]
        steps: ["새우와 채소를 볶고 밥과 달걀을 넣어 볶는다", "브로콜리를 삶아 우유와 함께 갈아 끓인다", "소금으로 간한다"]
      - title: 불고기 전골과 양배추 쌈
        time_min: 35
        ingredients: [{n: 불고기용 소고기, q: 500g, c: 정육}, {n: 양배추, q: 1/4통, c: 채소}, {n: 팽이버섯, q: 2봉, c: 채소}, {n: 당면, q: 100g, c: 곡류}, {n: 양파, q: 1개, c: 채소}]
        steps: ["고기를 간장 양념에 재운다", "냄비에 채소와 고기를 담고 육수를 붓는다", "끓으면 당면을 넣는다. 양배추는 쪄서 쌈으로 낸다"]
      - title: "주말 별식 - 수제 미트볼 스파게티"
        time_min: 45

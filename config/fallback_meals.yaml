# AI(Codex)를 쓸 수 없을 때(한도 초과·오류·로그아웃) 쓰는 기본 가정식 4주분.
# 한 주 = 저녁 7 + 아침 7 + 평일 간식 5 + 주말 점심 2(선택) + 일요일 밑반찬 1.
# 분량은 4인 가족(어른 2 + 초등 아이 2, 약 3.35인분) 기준이고, 가족 수에 맞춰 자동으로 늘리고 줄인다. 아이 맵기 0~1단계(kid_spice).
# 재료: n=이름, q=분량, c=장보기 분류. 집에 항상 있는 기본 양념(소금·간장·설탕·참기름·후추·마늘)은 적지 않는다.
# sides = 곁들이는 채소 반찬(저녁·점심은 2가지 이상). 주마다 성장 영양 체크(pa/core/growth.py)를 통과하도록 짜 두었고 테스트가 지킨다.
weeks:
  # ---------------------------------------------------------------- 1주차
  - dinners:
      - title: 된장찌개와 계란말이
        time_min: 30
        sides: [시금치나물, 콩나물무침]
        ingredients: [{n: 두부, q: 1모, c: 단백질}, {n: 애호박, q: 1개, c: 채소}, {n: 양파, q: 1개, c: 채소}, {n: 달걀, q: 5개, c: 단백질}, {n: 시금치, q: 1단, c: 채소}, {n: 콩나물, q: 1봉, c: 채소}]
        steps: ["멸치 육수에 된장을 풀고 애호박·양파·두부를 넣어 끓인다", "달걀에 다진 파를 섞어 얇게 부쳐 돌돌 만다", "시금치는 데쳐 무치고 콩나물은 삶아 무친다"]
      - title: 소불고기와 시금치나물
        time_min: 35
        sides: [시금치나물, 양배추쌈]
        ingredients: [{n: 불고기용 소고기, q: 600g, c: 정육}, {n: 양파, q: 1개, c: 채소}, {n: 당근, q: 1/2개, c: 채소}, {n: 시금치, q: 1단, c: 채소}, {n: 양배추, q: 1/4통, c: 채소}]
        steps: ["소고기를 간장·설탕·배즙·다진 마늘에 재운다", "시금치는 데쳐 참기름과 소금으로 무친다", "양파·당근과 함께 볶고 양배추는 쪄서 쌈으로 낸다"]
      - title: 고등어구이와 미역국
        time_min: 30
        sides: [콩나물무침, 오이무침]
        ingredients: [{n: 고등어, q: 2손, c: 생선}, {n: 마른 미역, q: 20g, c: 건어물}, {n: 소고기 국거리, q: 150g, c: 정육}, {n: 콩나물, q: 1봉, c: 채소}, {n: 오이, q: 2개, c: 채소}]
        steps: ["미역을 불려 소고기와 참기름에 볶다가 물을 붓고 끓인다", "고등어는 소금을 살짝 뿌려 팬에 굽는다", "콩나물과 오이는 각각 무쳐 반찬으로 낸다"]
      - title: 순한 닭볶음탕
        time_min: 40
        sides: [브로콜리숙회, 당근볶음]
        ingredients: [{n: 닭볶음탕용 닭, q: 1마리, c: 정육}, {n: 감자, q: 3개, c: 채소}, {n: 당근, q: 1개, c: 채소}, {n: 양파, q: 1개, c: 채소}, {n: 브로콜리, q: 1송이, c: 채소}]
        steps: ["닭은 끓는 물에 데쳐 씻는다", "간장·설탕·다진 마늘 양념과 물을 붓고 감자·당근을 넣어 끓인다", "브로콜리는 데쳐 곁들인다"]
        adult_note: 어른은 청양고추와 고춧가루를 따로 얹어 칼칼하게
      - title: 두부조림과 멸치볶음
        time_min: 25
        sides: [깻잎나물, 애호박볶음]
        ingredients: [{n: 두부, q: 2모, c: 단백질}, {n: 잔멸치, q: 80g, c: 건어물}, {n: 대파, q: 1대, c: 채소}, {n: 깻잎, q: 1묶음, c: 채소}, {n: 애호박, q: 1개, c: 채소}]
        steps: ["두부를 도톰하게 썰어 노릇하게 부친다", "간장 양념에 파를 넣고 두부를 조린다", "멸치는 마른 팬에 볶다가 간장·올리고당으로 버무린다"]
      - title: 카레라이스와 오이무침
        time_min: 35
        sides: [오이무침, 양배추샐러드]
        ingredients: [{n: 순한맛 카레, q: 1팩, c: 가공식품}, {n: 돼지고기 앞다리, q: 300g, c: 정육}, {n: 감자, q: 2개, c: 채소}, {n: 당근, q: 1개, c: 채소}, {n: 양파, q: 2개, c: 채소}, {n: 오이, q: 2개, c: 채소}, {n: 양배추, q: 1/4통, c: 채소}]
        steps: ["고기와 양파를 볶고 감자·당근을 넣어 물과 함께 끓인다", "불을 끄고 카레를 풀어 한소끔 더 끓인다", "오이는 식초·설탕·소금으로 무치고 양배추는 채 썰어 곁들인다"]
      - title: 소고기 야채죽과 계란찜
        time_min: 40
        sides: [당근볶음, 애호박나물]
        ingredients: [{n: 소고기 다짐육, q: 200g, c: 정육}, {n: 쌀, q: 2컵, c: 곡류}, {n: 당근, q: 1개, c: 채소}, {n: 애호박, q: 1개, c: 채소}, {n: 달걀, q: 4개, c: 단백질}]
        steps: ["불린 쌀과 다진 소고기를 참기름에 볶는다", "물을 붓고 잘게 다진 채소를 넣어 푹 끓인다", "달걀을 풀어 물과 섞어 중탕으로 찐다. 당근·애호박은 따로 볶아 곁들인다"]
    breakfasts:
      - title: 계란밥과 우유
        time_min: 10
        ingredients: [{n: 달걀, q: 4개, c: 단백질}, {n: 밥, q: 3공기, c: 곡류}, {n: 우유, q: 600ml, c: 유제품}, {n: 김, q: 1봉, c: 건어물}]
        steps: ["달걀프라이를 하고 밥 위에 올려 간장과 참기름을 두른다", "김과 함께 먹고 우유를 곁들인다"]
      - title: 치즈 토스트와 과일
        time_min: 10
        ingredients: [{n: 식빵, q: 1봉, c: 곡류}, {n: 슬라이스 치즈, q: 1봉, c: 유제품}, {n: 바나나, q: 3개, c: 과일}]
        steps: ["식빵에 치즈를 올려 팬이나 토스터에 굽는다", "바나나를 곁들인다"]
      - title: 참치마요 주먹밥과 달걀국
        time_min: 15
        ingredients: [{n: 참치캔, q: 2개, c: 가공식품}, {n: 밥, q: 3공기, c: 곡류}, {n: 달걀, q: 3개, c: 단백질}, {n: 김가루, q: 1봉, c: 건어물}]
        steps: ["기름 뺀 참치에 마요네즈를 조금 섞어 밥과 버무려 동그랗게 빚는다", "김가루를 묻힌다", "멸치 육수에 달걀을 풀어 국을 끓인다"]
      - title: 시리얼과 우유, 삶은 달걀
        time_min: 10
        ingredients: [{n: 통곡물 시리얼, q: 1봉, c: 곡류}, {n: 우유, q: 800ml, c: 유제품}, {n: 달걀, q: 4개, c: 단백질}]
        steps: ["달걀을 삶는다", "시리얼에 우유를 부어 먹는다"]
      - title: 두부 달걀 스크램블과 토스트
        time_min: 15
        ingredients: [{n: 두부, q: 1모, c: 단백질}, {n: 달걀, q: 4개, c: 단백질}, {n: 식빵, q: 1봉, c: 곡류}, {n: 방울토마토, q: 1팩, c: 채소}]
        steps: ["두부를 으깨 달걀과 섞어 팬에 볶는다", "토스트와 방울토마토를 곁들인다"]
      - title: 소고기 주먹밥과 우유
        time_min: 15
        ingredients: [{n: 소고기 다짐육, q: 150g, c: 정육}, {n: 밥, q: 3공기, c: 곡류}, {n: 우유, q: 600ml, c: 유제품}, {n: 김가루, q: 1봉, c: 건어물}]
        steps: ["소고기를 간장 양념에 볶는다", "밥과 섞어 한입 크기로 빚는다", "우유를 곁들인다"]
      - title: 바나나 팬케이크와 우유
        time_min: 15
        ingredients: [{n: 바나나, q: 3개, c: 과일}, {n: 달걀, q: 3개, c: 단백질}, {n: 우유, q: 700ml, c: 유제품}, {n: 팬케이크 가루, q: 1봉, c: 가공식품}]
        steps: ["으깬 바나나와 달걀, 우유, 가루를 섞어 반죽한다", "약불에 앞뒤로 굽는다"]
    snacks:
      - title: 플레인 요거트와 과일
        time_min: 5
        ingredients: [{n: 플레인 요거트, q: 4개, c: 유제품}, {n: 딸기, q: 1팩, c: 과일}]
        steps: ["요거트에 과일을 썰어 올린다"]
      - title: 치즈와 방울토마토
        time_min: 5
        ingredients: [{n: 슬라이스 치즈, q: 5장, c: 유제품}, {n: 방울토마토, q: 1팩, c: 채소}]
        steps: ["치즈를 접어 토마토와 함께 담는다"]
      - title: 우유와 구운 고구마
        time_min: 20
        ingredients: [{n: 고구마, q: 4개, c: 채소}, {n: 우유, q: 800ml, c: 유제품}]
        steps: ["고구마를 에어프라이어나 오븐에 굽는다", "우유를 곁들인다"]
      - title: 멸치 주먹밥
        time_min: 10
        ingredients: [{n: 잔멸치, q: 40g, c: 건어물}, {n: 밥, q: 2공기, c: 곡류}, {n: 김가루, q: 1봉, c: 건어물}]
        steps: ["볶은 멸치를 잘게 다져 밥과 섞어 작게 빚는다"]
      - title: 과일 요거트 스무디
        time_min: 5
        ingredients: [{n: 플레인 요거트, q: 4개, c: 유제품}, {n: 바나나, q: 2개, c: 과일}, {n: 우유, q: 400ml, c: 유제품}]
        steps: ["모든 재료를 믹서에 간다"]
    lunches:
      - title: 비빔국수와 두부부침
        time_min: 25
        sides: [오이무침, 당근채볶음]
        ingredients: [{n: 소면, q: 400g, c: 곡류}, {n: 두부, q: 1모, c: 단백질}, {n: 오이, q: 2개, c: 채소}, {n: 당근, q: 1개, c: 채소}]
        steps: ["소면을 삶아 헹군다", "간장·설탕·참기름 양념(어른은 고추장을 따로)으로 비빈다", "두부를 노릇하게 부친다"]
      - title: 달걀 볶음밥과 맑은 국
        time_min: 25
        sides: [애호박볶음, 시금치무침]
        ingredients: [{n: 밥, q: 4공기, c: 곡류}, {n: 달걀, q: 4개, c: 단백질}, {n: 애호박, q: 1개, c: 채소}, {n: 시금치, q: 1/2단, c: 채소}, {n: 어묵, q: 3장, c: 가공식품}]
        steps: ["달걀과 잘게 썬 애호박을 볶다가 밥을 넣어 볶는다", "시금치는 데쳐 무친다", "어묵을 넣은 맑은 국을 곁들인다"]
    prep:
      - title: 주말 밑반찬 - 소고기 장조림과 멸치볶음
        time_min: 60
        ingredients: [{n: 소고기 홍두깨, q: 400g, c: 정육}, {n: 꽈리고추, q: 1줌, c: 채소}, {n: 잔멸치, q: 60g, c: 건어물}]
        steps: ["고기를 삶아 건진다", "간장·설탕 국물에 졸인다", "멸치는 마른 팬에 볶아 양념한다. 냉장고에 두고 한 주 동안 곁들인다"]
  # ---------------------------------------------------------------- 2주차
  - dinners:
      - title: 순두부찌개(순한맛)와 달걀프라이
        time_min: 25
        sides: [애호박볶음, 콩나물무침]
        ingredients: [{n: 순두부, q: 2봉, c: 단백질}, {n: 돼지고기 다짐육, q: 150g, c: 정육}, {n: 달걀, q: 4개, c: 단백질}, {n: 대파, q: 1대, c: 채소}, {n: 애호박, q: 1개, c: 채소}, {n: 콩나물, q: 1봉, c: 채소}]
        steps: ["파·다진 고기를 기름에 볶고 물을 붓는다", "순두부와 애호박을 넣어 끓이고 간을 한다", "달걀프라이를 올린다. 콩나물은 무친다"]
        adult_note: 어른은 고추기름을 따로 넣어 얼큰하게
      - title: 제육볶음(순한맛)과 상추쌈
        time_min: 30
        sides: [상추쌈, 양파장아찌]
        ingredients: [{n: 돼지고기 앞다리, q: 600g, c: 정육}, {n: 양파, q: 2개, c: 채소}, {n: 상추, q: 2봉, c: 채소}, {n: 대파, q: 1대, c: 채소}]
        steps: ["고기를 간장·설탕·다진 마늘·케첩 약간에 재운다", "센 불에 양파·파와 볶는다", "상추에 싸서 먹는다"]
        adult_note: 어른 몫은 고추장·고춧가루를 더해 매콤하게
      - title: 연어구이와 시금치 된장국
        time_min: 30
        sides: [브로콜리숙회, 가지무침]
        ingredients: [{n: 연어, q: 600g, c: 생선}, {n: 시금치, q: 1단, c: 채소}, {n: 두부, q: 1모, c: 단백질}, {n: 레몬, q: 1개, c: 과일}, {n: 브로콜리, q: 1송이, c: 채소}]
        steps: ["연어에 소금·후추를 하고 팬에 앞뒤로 굽는다", "된장국에 시금치와 두부를 넣어 끓인다", "브로콜리를 데쳐 곁들이고 연어에 레몬즙을 뿌린다"]
      - title: 닭가슴살 채소 볶음밥과 달걀국
        time_min: 25
        sides: [오이무침, 방울토마토]
        ingredients: [{n: 닭가슴살, q: 400g, c: 정육}, {n: 밥, q: 5공기, c: 곡류}, {n: 당근, q: 1개, c: 채소}, {n: 애호박, q: 1개, c: 채소}, {n: 양파, q: 1개, c: 채소}, {n: 달걀, q: 4개, c: 단백질}, {n: 오이, q: 2개, c: 채소}]
        steps: ["닭가슴살과 채소를 잘게 썬다", "기름에 닭고기와 채소를 볶다가 밥과 간장을 넣고 볶는다", "멸치 육수에 달걀을 풀어 국을 끓인다"]
      - title: 소고기 무국과 감자채볶음
        time_min: 40
        sides: [감자채볶음, 시금치나물]
        ingredients: [{n: 소고기 국거리, q: 300g, c: 정육}, {n: 무, q: 1/2개, c: 채소}, {n: 감자, q: 3개, c: 채소}, {n: 대파, q: 1대, c: 채소}, {n: 시금치, q: 1단, c: 채소}]
        steps: ["소고기와 무를 참기름에 볶고 물을 부어 푹 끓인다", "감자는 채 썰어 물에 헹궈 기름에 볶는다", "시금치는 데쳐 무친다. 국은 간장·소금으로 간한다"]
      - title: 잔치국수와 애호박전
        time_min: 35
        sides: [애호박전, 당근채볶음]
        ingredients: [{n: 소면, q: 400g, c: 곡류}, {n: 애호박, q: 2개, c: 채소}, {n: 달걀, q: 4개, c: 단백질}, {n: 당근, q: 1개, c: 채소}, {n: 김가루, q: 1봉, c: 건어물}, {n: 잔멸치, q: 30g, c: 건어물}]

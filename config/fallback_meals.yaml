  # ---------------------------------------------------------------- 4주차
  - dinners:
      - title: 소고기 뭇국과 계란 장조림
        time_min: 45
        sides: [꽈리고추볶음, 시금치나물]
        ingredients: [{n: 소고기 홍두깨, q: 400g, c: 정육}, {n: 달걀, q: 8개, c: 단백질}, {n: 무, q: 1/2개, c: 채소}, {n: 꽈리고추, q: 1줌, c: 채소}, {n: 시금치, q: 1단, c: 채소}]
        steps: ["고기를 삶아 건지고 육수를 둔다", "육수에 간장·설탕을 넣고 고기와 삶은 달걀을 조린다", "무를 넣어 맑은 국을 끓이고 시금치는 데쳐 무친다"]
      - title: 고등어 무조림(순한맛)
        time_min: 40
        sides: [시금치나물, 콩나물무침]
        ingredients: [{n: 고등어, q: 2마리, c: 생선}, {n: 무, q: 1/2개, c: 채소}, {n: 양파, q: 1개, c: 채소}, {n: 대파, q: 1대, c: 채소}, {n: 시금치, q: 1단, c: 채소}, {n: 콩나물, q: 1봉, c: 채소}]
        steps: ["무를 깔고 물, 간장, 설탕, 다진 마늘 양념을 붓고 끓인다", "고등어와 양파를 올려 졸인다", "시금치와 콩나물은 각각 무쳐 곁들인다"]
        adult_note: 어른은 고춧가루를 더해 칼칼하게
      - title: 치킨 데리야끼와 감자수프
        time_min: 40
        sides: [브로콜리숙회, 양배추샐러드]
        ingredients: [{n: 닭다리살, q: 600g, c: 정육}, {n: 감자, q: 3개, c: 채소}, {n: 우유, q: 500ml, c: 유제품}, {n: 양파, q: 1개, c: 채소}, {n: 브로콜리, q: 1송이, c: 채소}, {n: 양배추, q: 1/4통, c: 채소}]
        steps: ["닭고기를 구운 뒤 간장·설탕·맛술 소스를 졸인다", "감자와 양파를 볶아 삶은 뒤 우유를 넣어 갈아 끓인다", "브로콜리를 데치고 양배추는 채 썰어 곁들인다"]
      - title: 비빔밥과 두부 달걀국
        time_min: 40
        sides: [시금치나물, 콩나물무침]
        ingredients: [{n: 소고기 다짐육, q: 250g, c: 정육}, {n: 시금치, q: 1/2단, c: 채소}, {n: 콩나물, q: 1봉, c: 채소}, {n: 당근, q: 1개, c: 채소}, {n: 애호박, q: 1개, c: 채소}, {n: 달걀, q: 5개, c: 단백질}, {n: 두부, q: 1모, c: 단백질}]
        steps: ["나물을 각각 데치거나 볶아 간한다", "소고기를 볶고 달걀프라이를 한다", "밥에 올려 비비고(어른은 고추장), 달걀 두부국을 곁들인다"]
      - title: 새우 볶음밥과 브로콜리 수프
        time_min: 30
        sides: [브로콜리수프, 오이무침]
        ingredients: [{n: 칵테일 새우, q: 300g, c: 생선}, {n: 밥, q: 5공기, c: 곡류}, {n: 달걀, q: 3개, c: 단백질}, {n: 당근, q: 1개, c: 채소}, {n: 브로콜리, q: 2송이, c: 채소}, {n: 우유, q: 300ml, c: 유제품}, {n: 오이, q: 2개, c: 채소}]
        steps: ["새우와 채소를 볶고 밥과 달걀을 넣어 볶는다", "브로콜리를 삶아 우유와 함께 갈아 끓인다", "오이는 무쳐 곁들인다"]
      - title: 불고기 전골과 양배추 쌈
        time_min: 35
        sides: [양배추쌈, 팽이버섯볶음]
        ingredients: [{n: 불고기용 소고기, q: 500g, c: 정육}, {n: 양배추, q: 1/4통, c: 채소}, {n: 팽이버섯, q: 2봉, c: 채소}, {n: 당면, q: 100g, c: 곡류}, {n: 양파, q: 1개, c: 채소}]
        steps: ["고기를 간장 양념에 재운다", "냄비에 채소와 고기를 담고 육수를 붓는다", "끓으면 당면을 넣는다. 양배추는 쪄서 쌈으로 낸다"]
      - title: 수제 미트볼 스파게티
        time_min: 45
        sides: [샐러드, 브로콜리숙회]
        ingredients: [{n: 소고기 다짐육, q: 400g, c: 정육}, {n: 스파게티면, q: 400g, c: 곡류}, {n: 토마토소스, q: 1병, c: 가공식품}, {n: 양파, q: 1개, c: 채소}, {n: 모차렐라 치즈, q: 1봉, c: 유제품}, {n: 샐러드 채소, q: 1봉, c: 채소}, {n: 브로콜리, q: 1송이, c: 채소}]
        steps: ["다진 고기에 다진 양파·달걀 약간·빵가루를 섞어 동그랗게 빚어 굽는다", "소스에 미트볼을 넣어 끓인다", "삶은 면에 얹고 치즈를 뿌린다. 샐러드를 곁들인다"]

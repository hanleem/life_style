[project]
name = "pa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-ulid>=2.7",
  "pyyaml>=6.0.3",
  "tzdata>=2026.5",
  "google-auth>=2.60.0",
  "google-auth-oauthlib>=1.5.0",
  "cryptography>=50.0.2",
  "pywebpush>=2.5.0",
  "segno>=1.6.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "freezegun>=1.5", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real_config: 기준 일정 대신 실제 config/settings.yaml 을 읽는다"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pa"]

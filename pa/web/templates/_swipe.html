{# 오늘 할 일 상자를 옆으로 밀면 읽음 처리(숨기기). PC 에서는 '읽음' 버튼. 숨긴 뒤 되돌리기 줄이 잠깐 뜬다. #}
<div id="undo-bar" class="undo-bar" role="status" hidden><span id="undo-text"></span> <button type="button" id="undo-btn">되돌리기</button></div>
<script id="swipe-js">
(function () {
  'use strict';
  const bar = document.getElementById('undo-bar');
  const txt = document.getElementById('undo-text');
  const btn = document.getElementById('undo-btn');
  let lastKey = null, timer = null;

  async function send(url, key) {
    const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({key: key})});
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  }

  async function hide(el, dir) {
    const key = el.dataset.swipeKey;
    el.style.transition = 'transform .2s ease, opacity .2s ease';
    el.style.transform = 'translateX(' + (dir * 110) + '%)';
    el.style.opacity = '0';
    try {
      const j = await send('/api/dismiss', key);
      setTimeout(function () { el.remove(); }, 200);
      lastKey = key;
      txt.textContent = '읽음 처리했습니다' + (j.label ? ': ' + j.label : '');
      bar.hidden = false;
      clearTimeout(timer);
      timer = setTimeout(function () { bar.hidden = true; }, 8000);
    } catch (e) {
      reset(el);
      if (typeof toast === 'function') toast('처리하지 못했습니다. 다시 시도해 주세요');
    }
  }

  function reset(el) {
    el.style.transition = 'transform .2s ease, opacity .2s ease';
    el.style.transform = '';
    el.style.opacity = '';
  }

  btn.addEventListener('click', async function () {
    if (!lastKey) return;
    try { await send('/api/dismiss/undo', lastKey); location.reload(); } catch (e) { /* 다시 누르면 된다 */ }
  });

  document.querySelectorAll('[data-undo-key]').forEach(function (b) {
    b.addEventListener('click', async function () {
      try { await send('/api/dismiss/undo', b.dataset.undoKey); location.reload(); } catch (e) { /* 다시 누르면 된다 */ }
    });
  });

  document.querySelectorAll('[data-swipe-key]').forEach(function (el) {
    let x0 = null, y0 = null, dx = 0, drag = false;
    el.addEventListener('touchstart', function (e) {
      const t = e.touches[0];
      x0 = t.clientX; y0 = t.clientY; dx = 0; drag = false;
      el.style.transition = 'none';
    }, {passive: true});
    el.addEventListener('touchmove', function (e) {
      if (x0 === null) return;
      const t = e.touches[0];
      dx = t.clientX - x0;
      const dy = t.clientY - y0;
      if (!drag) {
        if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) drag = true;     // 옆으로 미는 중
        else if (Math.abs(dy) > 12) { x0 = null; return; }                               // 세로 스크롤이면 놓아 준다
      }
      if (drag) {
        const w = el.offsetWidth || 1;
        el.style.transform = 'translateX(' + (dx / w * 100) + '%)';
        el.style.opacity = String(1 - Math.min(Math.abs(dx) / w, 1) * 0.7);
      }
    }, {passive: true});
    el.addEventListener('touchend', function () {
      if (x0 !== null && drag) {
        if (Math.abs(dx) > (el.offsetWidth || 1) * 0.35) hide(el, dx > 0 ? 1 : -1); else reset(el);
      }
      x0 = null; drag = false;
    });
    el.querySelectorAll('[data-read]').forEach(function (b) {
      b.addEventListener('click', function (ev) { ev.preventDefault(); hide(el, 1); });
    });
  });
})();
</script>
